apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-mcp-server
  namespace: obs-mcp
data:
  config.toml: |
    toolsets = ["observability/metrics", "observability/logs", "observability/traces", "observability/otelcol", "observability/alert-management"]
    experimental_enable_target_compatibility_tool_filters = true
    # List and preview only. To register silence writes and alert-rule
    # create/update/delete, set read_only = false (and disable_destructive =
    # false if the host defaults that to true).
    read_only = true

    [toolset_configs."observability/metrics"]
    auth_mode = "kubeconfig"
    prometheus_url = "http://prometheus-k8s.monitoring.svc:9090"
    alertmanager_url = "http://alertmanager-main.monitoring.svc:9093"

    [toolset_configs."observability/logs"]
    auth_mode = "kubeconfig"

    [toolset_configs."observability/traces"]
    auth_mode = "kubeconfig"

    [toolset_configs."observability/alert-management"]
    auth_mode = "kubeconfig"
    # Kind does not install monitoring-plugin. Leave unset so list tools
    # register and calls return "not configured". Use HTTPS if you install one;
    # plaintext http:// backends do not receive bearer tokens.
